name: Keep Supabase Alive

on:
  schedule:
    # Run every day at 6 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ContentMint Supabase
        run: |
          echo "🏓 Pinging ContentMint Supabase..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://qaztvwdieqojykgpfnvo.supabase.co/rest/v1/profiles?select=count&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhenR2d2RpZXFvanlrZ3BmbnZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMTQ1NDAsImV4cCI6MjA4OTU5MDU0MH0.ErSDa6gfH6yaEr6LoTcyhVGsxM3Uvlvk0wYFQUzZzVo" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhenR2d2RpZXFvanlrZ3BmbnZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMTQ1NDAsImV4cCI6MjA4OTU5MDU0MH0.ErSDa6gfH6yaEr6LoTcyhVGsxM3Uvlvk0wYFQUzZzVo")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ ContentMint Supabase is alive!"
          else
            echo "❌ ContentMint ping failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Summary
        run: |
          echo "================================================"
          echo "🎉 Keep-alive ping completed at $(date -u)"
          echo "================================================"
